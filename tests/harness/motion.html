<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#222;height:100%}</style></head>
<body>
<script>window.addEventListener("error",(e)=>{document.title="ERR "+e.message});</script><script type="module">
// The REAL viewer (stubbed ComfyUI scripts) with the Motion tab: PORT=8791 node tests/harness/server.mjs <viewer checkout>,
// then open http://127.0.0.1:8791/motion.html . The scenes come from agentY-core's examples; saves are kept in window.__saves,
// every /bepic/mgscene request in window.__asked. tests/test_viewer_browser.py drives this page with real pointer input.
window.__saves = [];
window.__asked = [];
const SCENES = { title_card: 1, lower_third: 1, logo_reveal: 1 };
const stemOf = (p) => decodeURIComponent(p).split(/[\/]/).pop().replace(/\.(mgscene\.json|png|mp4|mov|webm)$/i, "");
window.__fetchApi = async (p, opts) => {
  const j = (o, ok = true) => ({ ok, status: ok ? 200 : 404, json: async () => o });
  if (p.startsWith("/bepic/mgscene") && opts && opts.method === "POST") { window.__saves.push(JSON.parse(opts.body)); return j({ ok: true }); }
  if (p.startsWith("/bepic/mgscene")) {
    window.__asked.push(p);
    const q = new URLSearchParams(p.split("?")[1]);
    const ref = q.get("path") || q.get("filename") || "";
    const stem = stemOf(ref);
    if (!SCENES[stem]) return j({ error: "no scene" }, false);
    if (q.get("probe")) return j({ has_scene: true });
    const scene = await (await fetch("/scenes/" + stem + ".mgscene.json")).json();
    return j({ path: "D:/out/" + stem + ".mgscene.json", scene });
  }
  return j({}, false);
};
let v; try { v = await import("/extensions/viewer/bEpicViewer.js"); } catch (e) { document.title = "IMPORT " + e.message; throw e; }
const panel = v.mountStandaloneViewer(document.body);
window.__panel = panel;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
try {
  for (let i = 0; i < 100 && !(panel.dockLayout && panel.motionTimelinePanel); i++) await sleep(50);
  Object.assign(panel.style, { width: "1400px", height: "850px", left: "20px", top: "20px" });
  try { await window.__ext.setup(); } catch (e) { window.__setupErr = e.message; }
  window.__api = (await import("/scripts/api.js")).api;
  window.__ready = true;
  document.title = "ready";
} catch (e) { document.title = "ERR " + e.message; console.error(e); }
</script></body></html>
