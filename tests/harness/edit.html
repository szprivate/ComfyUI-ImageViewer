<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#222;height:100%}</style></head>
<body>
<script>window.addEventListener("error",(e)=>{document.title="ERR "+e.message});</script><script type="module">
// The REAL viewer (stubbed ComfyUI scripts) with the Edit panel up on a cut, for tests/test_edit_timeline_browser.py.
// The server's Edit routes are answered here (window.__fetchApi):
//   /bepic/timeline_probe   lengths from window.__media[path] ({ duration, audio, video })
//   /bepic/timeline_peaks   a waveform made up from the file's name (or window.__assets[path].peaks, a URL)
//   /bepic/timeline_strip   a sheet of coloured frames, one colour per second of the file (or __assets[path].strip[n]);
//                           start / end: of that part of the file only (each asked for kept in window.__strips)
//   /bepic/timeline_beats   window.__beats[path]
//   /bepic/timeline_cuts    window.__cuts[path]
//   /bepic/timeline_upload  the dropped file "kept" as D:/in/edits/<name>
//   /bepic/resolve_media    a canvas node's file, as D:/in/<its widget's value>
//   /bepic/timeline_render  answered at once; the request kept in window.__rendered
//   POST /bepic/timeline    a save: the cut sent comes back as the file now reads, as D:/out/cut.otio (a clip with
//                           takes names its active take's file); the request kept in window.__saves
// Every request is counted in window.__requests; window.__delay holds each answer back that many ms.
window.__requests = [];
window.__media = {};
window.__beats = {};
window.__cuts = {};
window.__assets = {};
window.__delay = 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const json = (data, status = 200) => new Response(JSON.stringify(data), { status, headers: { "Content-Type": "application/json" } });
const seedOf = (s) => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) & 0xffff, 7);
function fakePeaks(path, duration) {
  const levels = [];
  for (const bps of [25, 100, 400]) {
    const n = Math.ceil(duration * bps);
    const bytes = new Uint8Array(n * 2);
    const seed = seedOf(path);
    for (let i = 0; i < n; i++) {
      const t = i / bps;
      const env = 0.25 + 0.7 * Math.abs(Math.sin(t * 3.1 + seed)) * (0.6 + 0.4 * Math.sin(t * 17 + seed * 0.1));
      const a = Math.round(Math.max(1, Math.min(127, env * 127)));
      bytes[2 * i] = (-a) & 255; bytes[2 * i + 1] = a;
    }
    let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
    levels.push({ bps, n, data: btoa(bin) });
  }
  return { audio: true, duration, levels };
}
async function fakeStrip(path, n, h, duration, still, start, end) {
  n = still ? 1 : Math.max(1, n);
  const a = start != null ? Math.max(0, Math.min(Number(start), duration)) : 0;
  const b = end != null ? Math.max(a, Math.min(Number(end), duration)) : duration;
  const tw = Math.round(h * 16 / 9);
  const c = new OffscreenCanvas(tw * n, h);
  const g = c.getContext("2d");
  const seed = seedOf(path);
  for (let i = 0; i < n; i++) {
    const t = a + (b - a) * (i + 0.5) / n;
    const hue = (seed * 37 + Math.floor(t) * 60) % 360;
    g.fillStyle = `hsl(${hue} 60% 45%)`; g.fillRect(i * tw, 0, tw, h);
    g.fillStyle = "rgba(255,255,255,.8)"; g.fillRect(i * tw + (i * 7) % (tw - 8), h / 3, 8, h / 3);
  }
  const blob = await c.convertToBlob({ type: "image/jpeg", quality: 0.8 });
  return new Response(blob, { headers: { "Content-Type": "image/jpeg", "X-Strip-N": String(n), "X-Strip-Tw": String(tw),
                                          "X-Strip-Th": String(h), "X-Strip-Duration": String(still ? 0 : duration),
                                          "X-Strip-Start": String(still ? 0 : a), "X-Strip-End": String(still ? 0 : b) } });
}
window.__fetchApi = async (path, opts = {}) => {
  const u = new URL(path, "http://x");
  const p = u.searchParams.get("path") || "";
  window.__requests.push(u.pathname + (p ? "?" + p : "") + (u.searchParams.get("n") ? "&n=" + u.searchParams.get("n") : ""));
  if (window.__delay) await sleep(window.__delay);
  if (opts.signal && opts.signal.aborted) throw new DOMException("aborted", "AbortError");
  const m = window.__media[p] || {};
  const a = window.__assets[p];
  switch (u.pathname) {
    case "/bepic/timeline_probe": {
      const paths = JSON.parse(opts.body).paths;
      const info = {};
      for (const q of paths) info[q] = window.__media[q] || { error: "not found" };
      return json({ info });
    }
    case "/bepic/timeline_peaks":
      if (a && a.peaks) return fetch(a.peaks);
      return json(m.audio ? fakePeaks(p, m.duration || 4) : { audio: false, duration: 0, levels: [] });
    case "/bepic/timeline_strip": {
      const n = Number(u.searchParams.get("n")), h = Number(u.searchParams.get("h"));
      if (a && a.strip) {
        const key = Object.keys(a.strip).map(Number).sort((x, y) => Math.abs(x - n) - Math.abs(y - n))[0];
        const r = await fetch(a.strip[key].url);
        const meta = a.strip[key];
        return new Response(await r.blob(), { headers: { "Content-Type": "image/jpeg", "X-Strip-N": String(meta.n),
          "X-Strip-Tw": String(meta.tw), "X-Strip-Th": String(meta.th), "X-Strip-Duration": String(meta.duration) } });
      }
      // A part of the file (start / end): kept in window.__strips too.
      const ws = u.searchParams.get("start"), we = u.searchParams.get("end");
      (window.__strips ||= []).push({ path: p, n, start: ws == null ? null : Number(ws), end: we == null ? null : Number(we) });
      return fakeStrip(p, n, h, m.duration || 3, !!m.still, ws, we);
    }
    case "/bepic/timeline_beats": return json(window.__beats[p] || { bpm: 0, beats: [], note: "no beat" });
    case "/bepic/timeline_cuts": return json(window.__cuts[p] || { cuts: [], fps: 24, duration: m.duration || 0 });
    case "/bepic/timeline_shots": return json({ shots: [1, 2], cuts: [1], duration: 3 });
    case "/bepic/timeline_upload": {
      const f = opts.body.get("file");
      return json({ path: "D:/in/edits/" + f.name, name: f.name, reused: false });
    }
    case "/bepic/timeline_locate": return json({ paths: JSON.parse(opts.body).items.map((it) => "D:/out/" + it.filename) });
    // A loader node on the canvas: its file, as the server would name it.
    case "/bepic/resolve_media": {
      const b = JSON.parse(opts.body); const name = String(b.value || "").split(/[\/]/).pop();
      const kind = /\.(mp4|mov|webm)$/i.test(name) ? "video" : "image";
      return json({ tabs: [{ label: name, kind, frames: [{ path: "D:/in/" + name, name }] }] });
    }
    // Export film: what was asked for is kept in window.__rendered.
    case "/bepic/timeline_render": {
      window.__rendered = JSON.parse(opts.body);
      const f = window.__rendered.frames;
      return json({ path: "D:/out/cut_v001.mp4", name: "cut_v001.mp4", relative: "cut_v001.mp4", version: 1, fps: 24,
                    frames: f ? f[1] - f[0] + 1 : 0, texts_left_out: 0 });
    }
    // Export to Resolve: window.__resolve = { plan: overrides, polls: "running" answers before done, fail }.
    case "/bepic/timeline_export_resolve_plan": {
      const body = JSON.parse(opts.body), r = window.__resolve || {};
      (window.__resolvePlans ||= []).push(body);
      const nm = body.name || "cut_resolve", at = body.folder || "D:/out";
      return json({ folder: at, name: nm, path: at + "/" + nm, exists: false, size: 5 * 1048576, free: 900 * 1048576,
        files: [{ name: "a.mp4", size: 5 * 1048576, note: "" }], missing: [], refused: [], flagged: [], left_out: [],
        ...(r.plan || {}) });
    }
    case "/bepic/timeline_export_resolve": {
      (window.__resolveStarted ||= []).push(JSON.parse(opts.body));
      window.__resolveState = { polls: (window.__resolve || {}).polls ?? 2, cancelled: false };
      return json({ id: "job1", status: "running", done: 0, total: 5242880 });
    }
    case "/bepic/timeline_export_resolve_status": {
      const s = window.__resolveState, r = window.__resolve || {};
      if (s.cancelled) return json({ id: "job1", status: "cancelled", done: 0, total: 5242880 });
      if (s.polls-- > 0) return json({ id: "job1", status: "running", done: 1048576, total: 5242880, current: "a.mp4" });
      if (r.fail) return json({ id: "job1", status: "failed", done: 0, total: 5242880, error: r.fail });
      const path = "D:/out/" + window.__resolveStarted.at(-1).name;
      return json({ id: "job1", status: "done", done: 5242880, total: 5242880, result: { path, fcpxml: path + "/x.fcpxml", files: 1, size: 5242880,
        left_out: ["Clip colours."], flagged: [{ name: "a.mp4", note: "H.264 10-bit 4:2:2" }], missing: [] } });
    }
    case "/bepic/timeline_export_resolve_cancel": {
      window.__resolveState.cancelled = true;
      return json({ id: "job1", status: "running", done: 0, total: 5242880 });
    }
    case "/bepic/timeline_save_as": {
      const body = JSON.parse(opts.body);
      if (window.__saveFail) return { ok: false, status: window.__saveFail.status, json: async () => ({}), text: async () => window.__saveFail.text, headers: new Headers() };
      const name = String(body.name).replace(/\.otio$/i, "") + ".otio", full = body.folder + "/" + name;
      if ((window.__onDisk ||= {})[full] && !body.overwrite) return json({ exists: true, path: full }, 409);
      (window.__saveAs ||= []).push(body);
      const clips = body.edit.clips.map((c, i) => ({ ...c, ref: i, file: c.file || "D:/out/a.mp4" }));
      window.__onDisk[full] = true;
      return json({ edit: { name: name.slice(0, -5), fps: 24, clips, texts: [], sound: [], tracks: [], off: body.edit.off }, file: name, otio: full, path: full, target: { path: full, external: 1 }, duration: 0 });
    }
    case "/bepic/browse":
      return json({ path: "D:/out", parent: null, dirs: [], files: [{ name: "saved.otio", path: "D:/out/saved.otio", ext: ".otio", kind: "cut", size: 10, mtime: 1 }], roots: [] });
    case "/bepic/timeline": {
      if (!opts.body && window.__otio && window.__otio[u.searchParams.get("path")]) {
        const p = u.searchParams.get("path");
        return json({ edit: window.__otio[p], file: p.split("/").pop(), otio: p });
      }
      if (!opts.body) return { ok: false, status: 404, json: async () => ({}), text: async () => "no timeline", headers: new Headers() };
      const body = JSON.parse(opts.body);
      (window.__saves ||= []).push(body);
      if (window.__saveFail) return { ok: false, status: window.__saveFail.status, json: async () => ({}), text: async () => window.__saveFail.text, headers: new Headers() };
      const disk = (window.__disk ||= { clips: [], tracks: {} });
      const fileOf = (c, was) => (c.takes && c.takes.length ? (c.takes.find((t) => t.active) || c.takes[c.takes.length - 1]).file : (c.file || was || "D:/out/unknown.mp4"));
      const clips = body.edit.clips.map((c, i) => {
        const file = fileOf(c, Number.isInteger(c.ref) ? disk.clips[c.ref] : "");
        return { ...c, ref: i, file, transition: c.transition || 0 };
      });
      const tracks = (body.edit.tracks || []).map((k) => ({ ...k, clips: k.clips.map((c, i) => {
        const was = Array.isArray(c.ref) ? (disk.tracks[k.id] || [])[c.ref[1]] : "";
        return { ...c, ref: [2, i], file: fileOf(c, was) };
      }) }));
      disk.clips = clips.map((c) => c.file);
      disk.tracks = Object.fromEntries(tracks.map((k) => [k.id, k.clips.map((c) => c.file)]));
      return json({ edit: { name: body.name || "cut", fps: 24, clips, texts: [], sound: [], tracks, off: body.edit.off }, file: "cut.otio",
                    otio: "D:/out/cut.otio", target: { path: "D:/out/cut.otio", external: 1 }, duration: 0 });
    }
    case "/bepic/export_options": return json({ formats: { mp4: { codecs: ["h264"] }, mov: { codecs: ["prores"] } }, qualities: ["high"] });
    case "/bepic/export_target": return json({ path: "D:/out/cut_v001.mp4", relative: "cut_v001.mp4", version: 1 });
  }
  return { ok: false, status: 404, json: async () => ({}), text: async () => "", headers: new Headers() };
};
let v; try { v = await import("/extensions/viewer/bEpicViewer.js"); } catch (e) { document.title = "IMPORT " + e.message; throw e; }
const panel = v.mountStandaloneViewer(document.body);
window.__panel = panel;
try {
  for (let i = 0; i < 100 && !(panel.dockLayout && panel.editTimelinePanel); i++) await sleep(50);
  Object.assign(panel.style, { width: "1560px", height: "900px", left: "20px", top: "20px" });
  try { await window.__ext.setup(); } catch (e) { window.__setupErr = e.message; }
  window.__ready = true;
  document.title = "ready";
} catch (e) { document.title = "ERR " + e.message; console.error(e); }
</script></body></html>
